<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreBoard Full Window</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scoreboard-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Images/ScoreBoard.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        /* Số điểm: Tăng kích thước to hơn và căn vị trí */
        .score {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30vw; /* Đã phóng to số hơn */
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
        }

        /* Tên thí sinh: Dời xuống thấp hơn */
        .name {
            position: absolute;
            top: 90%; /* Tăng khoảng cách từ trên xuống để tên dời xuống thấp hơn */
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5vw;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.2vw;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <div id="orange_flash_overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(249, 115, 22, 0.85); pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.1s ease;"></div>
        <img id="scoreboard_thumbnail_img" src="Images/thumbnail.png" alt="Thumbnail" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 100; display: none;">
        <div class="score" id="sb_score" style="position: absolute; z-index: 60;">0</div>
        <div class="name" id="sb_name" style="position: absolute; z-index: 60;">THÍ SINH</div>
    </div>

    <script src="network_sync.js"></script>
    <script src="supabase-sync.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let playerIdx = parseInt(urlParams.get('player') || urlParams.get('ts') || '1') - 1;
        if (playerIdx < 0 || playerIdx > 3) playerIdx = 0;

        function updateScoreboardView(contestants) {
            if (!Array.isArray(contestants) || !contestants[playerIdx]) return;
            const c = contestants[playerIdx];
            const scoreEl = document.getElementById('sb_score');
            const nameEl = document.getElementById('sb_name');
            if (scoreEl) scoreEl.innerText = c.score !== undefined ? c.score : 0;
            if (nameEl) nameEl.innerText = (c.name || `THÍ SINH ${playerIdx + 1}`).toUpperCase();
        }

        function toggleThumbnailView(data) {
            const thumbEl = document.getElementById('scoreboard_thumbnail_img');
            if (!thumbEl) return;
            const contestantId = playerIdx + 1;
            const targetId = data.contestantId || data.targetSlot || 'ALL';
            if (targetId === 'ALL' || parseInt(targetId) === contestantId) {
                let show = false;
                if (data.type === 'SHOW_SCOREBOARD_THUMBNAIL') show = true;
                else if (data.type === 'HIDE_SCOREBOARD_THUMBNAIL') show = false;
                else show = data.show !== undefined ? data.show : (thumbEl.style.display === 'none' || !thumbEl.style.display);
                thumbEl.style.display = show ? 'block' : 'none';
                try { localStorage.setItem('ddvq_scoreboard_thumbnail_shown_' + contestantId, show ? 'true' : 'false'); } catch(e){}
            }
        }

        let flashInterval = null;
        function triggerOrangeFlash() {
            const overlay = document.getElementById('orange_flash_overlay');
            if (!overlay) return;
            if (flashInterval) clearInterval(flashInterval);

            let count = 0;
            const maxFlashes = 10;
            let isOn = false;

            flashInterval = setInterval(() => {
                isOn = !isOn;
                overlay.style.opacity = isOn ? '1' : '0';
                if (isOn) {
                    count++;
                    if (count >= maxFlashes) {
                        setTimeout(() => {
                            clearInterval(flashInterval);
                            flashInterval = null;
                            overlay.style.opacity = '0';
                        }, 250);
                    }
                }
            }, 250);

            isOn = true;
            overlay.style.opacity = '1';
            count = 1;
        }

        window.handleBroadcastMessage = function(data) {
            if (!data) return;
            if (data.type === 'TOGGLE_SCOREBOARD_THUMBNAIL' || data.type === 'SHOW_SCOREBOARD_THUMBNAIL' || data.type === 'HIDE_SCOREBOARD_THUMBNAIL') {
                toggleThumbnailView(data);
            } else if (data.scoreboardThumbnailStates) {
                const thumbEl = document.getElementById('scoreboard_thumbnail_img');
                const contestantId = playerIdx + 1;
                if (thumbEl && data.scoreboardThumbnailStates[contestantId] !== undefined) {
                    const show = !!data.scoreboardThumbnailStates[contestantId];
                    thumbEl.style.display = show ? 'block' : 'none';
                    try { localStorage.setItem('ddvq_scoreboard_thumbnail_shown_' + contestantId, show ? 'true' : 'false'); } catch(e){}
                }
            }

            if (
                data.type === 'S3_FLASH_SCOREBOARD' ||
                (data.type === 'PLAYER_RING_BELL' && (data.round === 'VUOT_SONG' || data.round === 'VS' || data.round === 'VCNV')) ||
                (data.type === 'PLAYER_SUBMIT_ANSWER' && (data.round === 'VS' || data.round === 'VUOT_SONG') && (data.isVongThi || !data.answer || data.answer.startsWith('[CNV]')))
            ) {
                const myId = playerIdx + 1;
                const targetC = data.contestantId;
                if (!targetC || parseInt(targetC) === myId) {
                    triggerOrangeFlash();
                }
            }

            if (data.contestants) {
                updateScoreboardView(data.contestants);
            }
            if (data.type === 'INITIAL_STATE_SYNC' && data.contestants) {
                updateScoreboardView(data.contestants);
            }
            if (data.type === 'UPDATE_SCORES' && data.contestants) {
                updateScoreboardView(data.contestants);
            }
            if (data.type === 'UPDATE_CONTESTANTS' && data.contestants) {
                updateScoreboardView(data.contestants);
            }
        };

        // Restore saved thumbnail state
        try {
            const contestantId = playerIdx + 1;
            const savedSelf = localStorage.getItem('ddvq_scoreboard_thumbnail_shown_' + contestantId);
            const savedAll = localStorage.getItem('ddvq_scoreboard_thumbnail_shown');
            const thumbEl = document.getElementById('scoreboard_thumbnail_img');
            if (thumbEl) {
                if (savedSelf === 'true' || (savedSelf === null && savedAll === 'true')) {
                    thumbEl.style.display = 'block';
                } else if (savedSelf === 'false') {
                    thumbEl.style.display = 'none';
                }
            }
        } catch(e) {}

        // Fetch authoritative server state if available
        function fetchCurrentState() {
            try {
                const saved = localStorage.getItem('ddvq_contestants');
                if (saved) {
                    const list = JSON.parse(saved);
                    if (Array.isArray(list) && list[playerIdx]) {
                        updateScoreboardView(list);
                    }
                }
            } catch(e) {}

            if (typeof hasLocalServerBackend === 'function' && !hasLocalServerBackend()) return;
            const stateUrl = typeof getApiUrl === 'function' ? getApiUrl('/api/state') : '/api/state';
            fetch(stateUrl)
                .then(r => r.json())
                .then(data => {
                    if (data && data.contestants) {
                        updateScoreboardView(data.contestants);
                    }
                })
                .catch(() => {});
        }

        // 1. BroadcastChannel
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                const channel = new BroadcastChannel('ddvq_game_channel');
                channel.onmessage = function(e) {
                    window.handleBroadcastMessage(e.data);
                };
            }
        } catch(e) {}

        // 2. Server-Sent Events (SSE)
        if (typeof EventSource !== 'undefined') {
            try {
                const sseUrl = typeof getApiUrl === 'function' ? getApiUrl('/api/events') : '/api/events';
                const sse = new EventSource(sseUrl);
                sse.onmessage = function(e) {
                    try {
                        const data = JSON.parse(e.data);
                        window.handleBroadcastMessage(data);
                    } catch(err) {}
                };
            } catch(e) {}
        }

        // 3. Storage Event
        window.addEventListener('storage', function(e) {
            if (e.key === 'ddvq_latest_action' && e.newValue) {
                try {
                    window.handleBroadcastMessage(JSON.parse(e.newValue));
                } catch(err) {}
            } else if (e.key === 'ddvq_contestants' && e.newValue) {
                try {
                    const list = JSON.parse(e.newValue);
                    if (Array.isArray(list)) {
                        updateScoreboardView(list);
                    }
                } catch(err) {}
            }
        });

        // 4. PostMessage Event
        window.addEventListener('message', function(e) {
            if (e.data) window.handleBroadcastMessage(e.data);
        });

        fetchCurrentState();
        setInterval(fetchCurrentState, 1500);
    </script>
</body>
</html>
